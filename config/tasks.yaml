# Configuration des tâches d'apprentissage
#
# Ce fichier définit, pour chaque tâche, la colonne à prédire (target),
# l'algorithme utilisé (estimator) et ses hyperparamètres (params).
# Il est lu par Settings (src/config.py) et utilisé par TrainingPipeline.
#
# Modifier ce fichier ne change rien au modèle en service : il faut relancer
# l'entraînement pour que la nouvelle configuration
# soit prise en compte.
#
# Format :
#   target    : nom exact d'une colonne du snapshot (data/raw/<date>.parquet)
#   estimator : nom d'une classe scikit-learn, par exemple RandomForestClassifier.
#               Le code doit savoir faire le lien entre ce nom et la classe.
#   params    : arguments passés à l'estimateur à sa création.
#               Laisser vide ({}) pour garder les valeurs par défaut de scikit-learn.
#
# null signifie "pas encore défini". L'entraînement doit s'arrêter avec un
# message clair si une valeur nécessaire vaut null.

classification:
  target: null # colonne qualitative à prédire
  estimator: null # ex. RandomForestClassifier
  params: {} # ex. {n_estimators: 200, random_state: 42}

regression:
  target: null # colonne numérique à prédire
  estimator: null # ex. RandomForestRegressor
  params: {}
